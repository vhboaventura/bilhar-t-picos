<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="Segoe UI, Roboto, Arial, sans-serif"><rect width="880" height="500" fill="#ffffff"/><text x="24" y="32" font-size="19" font-weight="700" fill="#1f2937">Custo por frame × número de bolas</text><text x="24" y="52" font-size="13" fill="#6b7280">T1 cresce linearmente com n; T2 só paga O(n) nas reancoragens. Menor é melhor.</text><rect x="24.0" y="69" width="14" height="14" rx="3" fill="#e5484d"/><text x="44.0" y="81" font-size="13" fill="#1f2937">T1 força bruta</text><rect x="164.0" y="69" width="14" height="14" rx="3" fill="#f59e0b"/><text x="184.0" y="81" font-size="13" fill="#1f2937">T2 ordem 0, sem reancorar</text><rect x="381.0" y="69" width="14" height="14" rx="3" fill="#0ea5b7"/><text x="401.0" y="81" font-size="13" fill="#1f2937">T2 Euler, sem reancorar</text><rect x="584.0" y="69" width="14" height="14" rx="3" fill="#8b5cf6"/><text x="604.0" y="81" font-size="13" fill="#1f2937">T2 ordem 0, reancora/30</text><rect x="24.0" y="91" width="14" height="14" rx="3" fill="#10b981"/><text x="44.0" y="103" font-size="13" fill="#1f2937">T2 Euler, reancora/30</text><line x1="86" x2="852" y1="434.0" y2="434.0" stroke="#e5e7eb"/><text x="78" y="438.0" font-size="12" text-anchor="end" fill="#6b7280">10 ns</text><line x1="86" x2="852" y1="357.5" y2="357.5" stroke="#e5e7eb"/><text x="78" y="361.5" font-size="12" text-anchor="end" fill="#6b7280">100 ns</text><line x1="86" x2="852" y1="281.0" y2="281.0" stroke="#e5e7eb"/><text x="78" y="285.0" font-size="12" text-anchor="end" fill="#6b7280">1 µs</text><line x1="86" x2="852" y1="204.5" y2="204.5" stroke="#e5e7eb"/><text x="78" y="208.5" font-size="12" text-anchor="end" fill="#6b7280">10 µs</text><line x1="86" x2="852" y1="128.0" y2="128.0" stroke="#e5e7eb"/><text x="78" y="132.0" font-size="12" text-anchor="end" fill="#6b7280">100 µs</text><line x1="86.0" x2="86.0" y1="128" y2="434" stroke="#e5e7eb"/><text x="86.0" y="454" font-size